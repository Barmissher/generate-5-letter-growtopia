<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>5 Letter Generator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #0f1115;
    color: #f5f5f5;
    display: flex;
    justify-content: center;
}

.container {
    width: min(720px, 94%);
    padding: 35px 0 50px;
}

h1 {
    text-align: center;
    margin: 0 0 8px;
}

.sub {
    text-align: center;
    color: #999;
    margin-bottom: 28px;
}

.card {
    background: #191c23;
    border: 1px solid #292d36;
    border-radius: 18px;
    padding: 25px;
}

.word {
    min-height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 48px;
    font-weight: 800;
    letter-spacing: 12px;

    background: #101217;
    border-radius: 14px;
    margin-bottom: 8px;
}

.status {
    text-align: center;
    color: #777;
    font-size: 12px;
    margin-bottom: 15px;
}

button {
    border: 0;
    border-radius: 10px;
    padding: 13px 18px;

    font-size: 15px;
    font-weight: 700;

    cursor: pointer;
    color: white;
    background: #303640;
}

button:hover {
    filter: brightness(1.15);
}

.generate {
    width: 100%;
    background: #2563eb;
    font-size: 17px;
    margin-bottom: 12px;
}

.row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.success {
    background: #16803c;
}

.fail {
    background: #b4232f;
}

.copy {
    background: #555d69;
}

.section {
    margin-top: 25px;
}

.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.section-title h2 {
    font-size: 18px;
    margin: 0;
}

.count {
    color: #888;
    font-size: 13px;
}

ul {
    list-style: none;
    padding: 0;
    margin: 0;
}

li {
    display: flex;
    gap: 7px;
    align-items: center;

    padding: 10px 12px;
    background: #101217;
    border-radius: 10px;
    margin-bottom: 7px;

    font-family: monospace;
    font-size: 20px;
    letter-spacing: 3px;
}

li span {
    flex: 1;
}

li button {
    padding: 7px 10px;
    font-size: 12px;
}

.empty {
    color: #777;
    text-align: center;
    padding: 20px;
    background: #101217;
    border-radius: 10px;
}

.note {
    text-align: center;
    color: #666;
    font-size: 12px;
    margin-top: 18px;
}
</style>
</head>

<body>

<div class="container">

    <h1>5 Letter Generator</h1>

    <div class="sub">
        Setiap hasil hanya muncul sekali
    </div>

    <div class="card">

        <div id="word" class="word">
            -----
        </div>

        <div id="status" class="status">
            Belum ada kata digunakan
        </div>

        <button class="generate" onclick="generateWord()">
            Generate 5 Huruf
        </button>

        <div class="row">

            <button class="copy" onclick="copyWord()">
                Salin
            </button>

            <button class="success" onclick="markSuccess()">
                ✓ Berhasil
            </button>

        </div>

        <button
            class="fail"
            style="width:100%;margin-top:10px"
            onclick="markFail()"
        >
            ✕ Gagal
        </button>


        <div class="section">

            <div class="section-title">

                <h2>
                    ❌ Riwayat Gagal
                </h2>

                <span id="count" class="count">
                    0 data
                </span>

            </div>

            <div id="failed"></div>

        </div>

    </div>

    <div class="note">
        Riwayat disimpan di browser.
        Kata berhasil maupun gagal tidak akan muncul lagi.
    </div>

</div>


<script>



const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

let used = JSON.parse(
    localStorage.getItem("used5letters") || "[]"
);

let failed = JSON.parse(
    localStorage.getItem("failed5letters") || "[]"
);

let success = JSON.parse(
    localStorage.getItem("success5letters") || "[]"
);

let current = "";

function save() {

    localStorage.setItem(
        "used5letters",
        JSON.stringify(used)
    );

    localStorage.setItem(
        "failed5letters",
        JSON.stringify(failed)
    );

    localStorage.setItem(
        "success5letters",
        JSON.stringify(success)
    );
}

function generateWord() {

    let word;

    do {

        word = "";

        for (let i = 0; i < 5; i++) {

            word += letters[
                Math.floor(Math.random() * 26)
            ];

        }

    } while (used.includes(word));


    current = word;

  
    used.push(word);

    save();

    document.getElementById("word").textContent = word;

    render();
}



function copyWord() {

    if (!current) {

        alert("Generate dulu.");

        return;
    }

    navigator.clipboard.writeText(current)
        .then(() => {

            alert("Tersalin: " + current);

        });
}



function markFail() {

    if (!current) {

        alert("Generate dulu.");

        return;
    }

    if (!failed.includes(current)) {

        failed.unshift(current);

    }

    save();

    
    generateWord();
}



function markSuccess() {

    if (!current) {

        alert("Generate dulu.");

        return;
    }

    if (!success.includes(current)) {

        success.unshift(current);

    }

    save();

    
    generateWord();
}


function copyItem(word) {

    navigator.clipboard.writeText(word);

}



function render() {

    document.getElementById("count").textContent =
        failed.length + " data";


    document.getElementById("status").textContent =
        "Digunakan: " + used.length +
        " • Berhasil: " + success.length +
        " • Gagal: " + failed.length;


    const box =
        document.getElementById("failed");


    if (!failed.length) {

        box.innerHTML =
            '<div class="empty">' +
            'Belum ada kata yang gagal.' +
            '</div>';

        return;
    }


    box.innerHTML = failed.map(word =>

        '<li>' +

        '<span>' +
        word +
        '</span>' +

        '<button class="copy" ' +
        'onclick="copyItem(\'' +
        word +
        '\')">' +

        'Salin' +

        '</button>' +

        '</li>'

    ).join("");

}


// Jalankan saat halaman dibuka
render();

</script>

</body>
</html>
